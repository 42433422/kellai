[package]
name = "kellai-desktop"
version = "1.0.1"
description = "客来来桌面客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "kellai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
