[project]
name = "kellai"
version = "1.0.1"
description = "客来来 — XCMAX 本地账号连接与收发工具"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "httpx[socks]>=0.27.0",
  "requests>=2.32.0",
  "cryptography==50.0.2",
  "keyring==25.7.0",
  "Authlib==1.9.10",
  "httpx2==2.16.2",
]

[project.scripts]
kellai = "app.main:run"

[dependency-groups]
test = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]
build = ["pyinstaller==6.22.3"]
browser = ["playwright==1.62.0"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
