# Linux host-network mode preserves the loopback-only desktop handoff boundary.
# Windows/macOS use the packaged sidecar or the Python entry in README.
services:
  kellai-backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8793", "--workers", "1"]
    volumes:
      - kellai-data:/data
    environment:
      KELLAI_DATA_DIR: /data
      KELLAI_PORT: "8793"
      KELLAI_VAULT_KEY: ${KELLAI_VAULT_KEY:?请注入持久受保护的凭据库主密钥}
      KELLAI_WORKSPACE_ID: ${KELLAI_WORKSPACE_ID:-}
      KELLAI_XCMAX_API_BASE: http://127.0.0.1:17500
volumes:
  kellai-data:
